<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick2Sell Pro</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f6f3ee;color:#111}
.app{max-width:620px;margin:auto;padding:24px}
h1{font-size:40px;margin:18px 0 4px}.pro{font-size:16px;background:#2f7d4f;color:white;border-radius:20px;padding:6px 12px}
.sub{font-size:21px;color:#666;margin-bottom:24px}
.card{background:white;border-radius:24px;padding:22px;margin:18px 0;box-shadow:0 8px 24px #0001}
input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:16px;padding:15px;font-size:17px}
textarea{min-height:100px}
button{width:100%;border:0;border-radius:16px;background:#ff6a00;color:white;font-size:20px;font-weight:800;padding:17px;margin-top:16px;cursor:pointer}
button:disabled{background:#aaa}
.preview{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.preview img{width:105px;height:105px;object-fit:cover;border-radius:16px;border:1px solid #ddd}
.result{white-space:pre-wrap;line-height:1.5;font-size:16px}
.badge{display:inline-block;background:#eaf6ee;color:#2f7d4f;border-radius:999px;padding:6px 12px;font-weight:800}
.small{color:#777;text-align:center;font-size:13px;margin:18px 0}
</style>
</head>

<body>
<div class="app">
  <h1>🏷️ Quick2Sell <span class="pro">Pro</span></h1>
  <div class="sub">Maak een foto. Krijg slim verkoopadvies.</div>

  <div class="card">
    <h2>1. Upload productfoto’s</h2>
    <input id="photos" type="file" accept="image/*" multiple>
    <div id="count" class="small"></div>
    <div id="preview" class="preview"></div>
  </div>

  <div class="card">
    <h2>2. Extra info</h2>
    <textarea id="info" placeholder="Bijv. Volkswagen Golf 7, bouwjaar 2016, 180.000 km, schade, accessoires..."></textarea>

    <label style="display:block;margin-top:14px;font-weight:800">Verkoopdoel</label>
    <select id="goal">
      <option value="slim">⚖️ Slim verkopen</option>
      <option value="snel">⚡ Snel verkopen</option>
      <option value="max">💰 Maximale opbrengst</option>
    </select>

    <button id="btn" onclick="analyseer()">Analyseer met AI</button>
  </div>

  <div class="card">
    <h2>3. Quick2Sell voorstel</h2>
    <div id="result" class="result">Upload foto’s en klik op analyseren.</div>
  </div>

  <div class="small">
    Quick2Sell geeft een AI-verkoopvoorstel. Jij controleert en beslist altijd zelf.
  </div>
</div>

<script>
const photos = document.getElementById("photos");
const preview = document.getElementById("preview");
const count = document.getElementById("count");
const result = document.getElementById("result");
const btn = document.getElementById("btn");

photos.addEventListener("change", () => {
  preview.innerHTML = "";
  const files = [...photos.files].slice(0, 6);
  count.textContent = files.length + " foto('s) geselecteerd";

  files.forEach(file => {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    preview.appendChild(img);
  });
});

async function analyseer() {
  const files = [...photos.files].slice(0, 6);
  const info = document.getElementById("info").value.trim();
  const goal = document.getElementById("goal").value;

  if (!files.length) {
    result.textContent = "Upload minimaal één foto.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "AI analyseert...";
  result.textContent = "AI bekijkt de foto’s en maakt een verkoopvoorstel...";

  try {
    const images = await Promise.all(files.map(fileToDataUrl));

    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ images, info, goal })
    });

    const data = await response.json();

    if (!response.ok) {
      result.textContent = "Fout: " + (data.error || "Analyse mislukt");
    } else {
      result.textContent = data.result || "Geen analyse ontvangen.";
    }
  } catch (err) {
    result.textContent = "Verbindingsfout: " + err.message;
  }

  btn.disabled = false;
  btn.textContent = "Analyseer met AI";
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error("Foto kon niet gelezen worden"));
    reader.readAsDataURL(file);
  });
}
</script>
</body>
</html>
